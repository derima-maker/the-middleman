<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator via Marketplace</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; border-radius: 24px; padding: 30px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #d2d2d7; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        button { width: 100%; padding: 12px; font-size: 18px; font-weight: 600; background: #007aff; color: white; border: none; border-radius: 12px; cursor: pointer; }
        .result { margin-top: 20px; font-size: 24px; font-weight: 700; padding: 12px; border-radius: 12px; background: #f2f2f7; min-height: 40px; }
        .error { color: #ff3b30; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔢 Calculator</h2>
        <input type="text" id="calcInput" placeholder="2+2">
        <button onclick="calculate()">Calculate</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const PRODUCT_ID = 7;   // ⚠️ CHANGE TO YOUR REAL PRODUCT ID
        const API_KEY = 'mp_YueKaKNcIPvJBSDckQDT8k73QdSxgdxWOoEeNH-3B-E';
        const BASE = 'https://api-marketplace-backend-1.onrender.com';

        async function calculate() {
            const expr = document.getElementById('calcInput').value.trim();
            const res = document.getElementById('result');
            res.textContent = '...';
            res.className = 'result';

            // Use api_key as query param – no preflight CORS needed
            const url = `${BASE}/gateway/${PRODUCT_ID}/?calc=${encodeURIComponent(expr)}&api_key=${API_KEY}`;

            try {
                const resp = await fetch(url);
                if (!resp.ok) {
                    const err = await resp.json();
                    res.textContent = err.error || 'Gateway error';
                    res.classList.add('error');
                    return;
                }
                const data = await resp.json();
                res.textContent = data.result;
            } catch (e) {
                res.textContent = 'Network error – check console';
                res.classList.add('error');
                console.error(e);
            }
        }

        window.onload = calculate;
    </script>
</body>
</html>
